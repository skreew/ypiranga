name: Atualizar Cardápio Diário

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0 # Baixa todo o histórico para permitir o rebase corretamente

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Sincronizar com GitHub (Evitar Conflitos)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Puxa as alterações mais recentes do GitHub antes de rodar o robô
          git pull --rebase origin main

      - name: Rodar robô de atualização
        run: python atualizar_cardapio.py

      - name: Salvar alterações no Git
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Atualização automática do cardápio (Playwright)"
          file_pattern: menu.json
          branch: main
